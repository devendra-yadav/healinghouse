spring:
  application:
    name: healinghouse

  datasource:
    url: jdbc:mysql://localhost:3306/healing_house_clinic?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&maxAllowedPacket=67108864
    username: hh_user
    password: ${HEALING_HOUSE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: com.clinic.healinghouse.config.HealingHouseMySQLDialect

  thymeleaf:
    cache: false

server:
  port: 9825