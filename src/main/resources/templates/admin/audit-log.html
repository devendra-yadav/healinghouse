<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head>
    <th:block th:replace="~{fragments/layout :: head(${pageTitle})}"/>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar('AuditLog')}"></nav>

<main class="container-fluid px-4 py-4 flex-grow-1">
    <th:block th:replace="~{fragments/layout :: alerts}"/>

    <h4 class="section-header mb-3">Audit Log</h4>
    <p class="text-muted small mb-3">
        Every create/update/delete recorded across the system — who changed it, when, and what field(s) changed.
        Internal forensic tool; not exportable.
    </p>

    <!-- Filters -->
    <form th:action="@{/admin/audit-log}" method="get" class="card shadow-sm mb-3">
        <input type="hidden" name="size" th:value="${entries.size}"/>
        <div class="card-body py-2">
            <div class="row g-2 align-items-end">
                <div class="col-md-2">
                    <label class="form-label small mb-1">From</label>
                    <input type="date" name="dateFrom" class="form-control form-control-sm" th:value="${dateFrom}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small mb-1">To</label>
                    <input type="date" name="dateTo" class="form-control form-control-sm" th:value="${dateTo}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small mb-1">Username</label>
                    <input type="text" name="username" class="form-control form-control-sm" th:value="${username}" placeholder="Any user">
                </div>
                <div class="col-md-2">
                    <label class="form-label small mb-1">Entity</label>
                    <select name="entityType" class="form-select form-select-sm">
                        <option value="">All</option>
                        <option th:each="et : ${entityTypes}"
                                th:value="${et}" th:text="${et}"
                                th:selected="${et == entityType}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small mb-1">Action</label>
                    <select name="action" class="form-select form-select-sm">
                        <option value="">All</option>
                        <option th:each="a : ${actions}"
                                th:value="${a}" th:text="${a}"
                                th:selected="${a == action}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-hh btn-sm w-100">
                        <i class="bi bi-funnel me-1"></i>Filter
                    </button>
                </div>
            </div>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Entity</th>
                        <th>Id</th>
                        <th>Details</th>
                        <th>IP</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${entries.content}">
                        <td class="text-nowrap" th:text="${#temporals.format(entry.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
                        <td th:text="${entry.username}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${entry.action.name() == 'CREATE'} ? 'text-bg-success' : (${entry.action.name() == 'DELETE'} ? 'text-bg-danger' : 'text-bg-primary')"
                                  th:text="${entry.action}">
                            </span>
                        </td>
                        <td th:text="${entry.entityType}"></td>
                        <td th:text="${entry.entityId}"></td>
                        <td class="small" style="max-width:480px; white-space:normal; word-break:break-word;" th:text="${entry.details}"></td>
                        <td class="small text-muted" th:text="${entry.ipAddress}"></td>
                    </tr>
                    <tr th:if="${entries.empty}">
                        <td colspan="7" class="text-center text-muted py-3">No audit entries match this filter.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-2">
        <span th:if="${entries.totalPages > 1}" class="text-muted small"
              th:text="'Page ' + (${entries.number} + 1) + ' of ' + ${entries.totalPages}">
        </span>
        <div th:if="${entries.totalPages > 1}" class="btn-group btn-group-sm">
            <a class="btn btn-outline-secondary" th:classappend="${entries.first} ? 'disabled'"
               th:href="@{/admin/audit-log(dateFrom=${dateFrom},dateTo=${dateTo},username=${username},entityType=${entityType},action=${action},size=${entries.size},page=${entries.number - 1})}">
                <i class="bi bi-chevron-left"></i> Prev
            </a>
            <a class="btn btn-outline-secondary" th:classappend="${entries.last} ? 'disabled'"
               th:href="@{/admin/audit-log(dateFrom=${dateFrom},dateTo=${dateTo},username=${username},entityType=${entityType},action=${action},size=${entries.size},page=${entries.number + 1})}">
                Next <i class="bi bi-chevron-right"></i>
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
