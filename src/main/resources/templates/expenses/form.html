<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head>
    <th:block th:replace="~{fragments/layout :: head(${pageTitle})}"/>
</head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar('Expenses')}"></nav>

<main class="container-fluid px-4 py-4 flex-grow-1">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/expenses}">Expenses</a></li>
            <li class="breadcrumb-item active" th:text="${pageTitle}"></li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header py-3">
                    <h5 class="mb-0" th:text="${pageTitle}"></h5>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

                    <form th:action="${expenseForm.id == null} ? @{/expenses} : @{/expenses/{id}(id=${expenseForm.id})}"
                          th:object="${expenseForm}" method="post">
                        <input type="hidden" th:field="*{id}"/>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                                <select id="categorySelect" th:field="*{categoryId}" class="form-select">
                                    <option value="">Select a category…</option>
                                    <option th:each="c : ${allCategories}" th:value="${c.id}" th:text="${c.name}"
                                            th:attr="data-payout=${c.payoutCategory}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                                <input type="date" th:field="*{expenseDate}" class="form-control"/>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Amount (₹) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" th:field="*{amount}" class="form-control" step="0.01" min="0.01" placeholder="0.00"/>
                                </div>
                                <div id="commissionSuggestion" class="form-text text-info" style="display:none;"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Payment Method</label>
                                <select th:field="*{paymentMethod}" class="form-select">
                                    <option value="">—</option>
                                    <option th:each="pm : ${paymentMethods}" th:value="${pm}" th:text="${pm}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Vendor</label>
                            <input type="text" th:field="*{vendorName}" class="form-control" placeholder="Shop/supplier name (optional)"/>
                        </div>

                        <div id="therapistGroup" class="mb-3" style="display:none;">
                            <label class="form-label fw-semibold">Therapist</label>
                            <select id="therapistSelect" th:field="*{therapistId}" class="form-select">
                                <option value="">Select a therapist…</option>
                                <option th:each="t : ${allTherapists}" th:value="${t.id}" th:text="${t.fullName}"></option>
                            </select>
                            <div class="form-text">
                                Reference only, never binding: <span id="commissionSuggestionInline">select a therapist to see their current-month commission/bonus figure</span>.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Notes</label>
                            <textarea th:field="*{notes}" class="form-control" rows="2" placeholder="optional"></textarea>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end border-top pt-3">
                            <a th:href="@{/expenses}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-lg me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-hh">
                                <i class="bi bi-check-lg me-1"></i>Save Expense
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"/>
<script th:inline="javascript">
    // The therapist picker + read-only commission hint apply to whichever category is flagged
    // "payout category" (requirements/Expenses_Requirements_v1.md §5.4) — keyed off each <option>'s
    // stable data-payout attribute, not the category's (renameable) display name, so renaming
    // "Salaries & Commission" can't silently break this (Bug_Report_v6.md Finding 12). The
    // suggested figure is never written into the amount field, it's a reference only.
    const categorySelect = document.getElementById('categorySelect');
    const therapistGroup = document.getElementById('therapistGroup');
    const therapistSelect = document.getElementById('therapistSelect');
    const suggestionEl = document.getElementById('commissionSuggestion');

    function isPayoutCategorySelected() {
        const opt = categorySelect.options[categorySelect.selectedIndex];
        return opt && opt.dataset.payout === 'true';
    }

    function toggleTherapistGroup() {
        therapistGroup.style.display = isPayoutCategorySelected() ? '' : 'none';
        if (!isPayoutCategorySelected()) {
            suggestionEl.style.display = 'none';
        }
    }

    function fetchCommissionSuggestion() {
        const therapistId = therapistSelect.value;
        if (!therapistId) {
            suggestionEl.style.display = 'none';
            return;
        }
        const today = new Date();
        const dateFrom = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().slice(0, 10);
        const dateTo = today.toISOString().slice(0, 10);
        fetch(`/expenses/commission-suggestion?therapistId=${therapistId}&dateFrom=${dateFrom}&dateTo=${dateTo}`)
            .then(r => r.ok ? r.json() : null)
            .then(amount => {
                if (amount === null) return;
                suggestionEl.textContent = `Reference: current-month commission/bonus for this therapist is ₹${Number(amount).toFixed(2)} (not auto-filled).`;
                suggestionEl.style.display = '';
            })
            .catch(() => { suggestionEl.style.display = 'none'; });
    }

    categorySelect.addEventListener('change', toggleTherapistGroup);
    therapistSelect.addEventListener('change', fetchCommissionSuggestion);
    toggleTherapistGroup();
    if (isPayoutCategorySelected()) fetchCommissionSuggestion();
</script>
</body>
</html>
